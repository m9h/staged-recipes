{% set name = "pygpc" %}
{% set version = "0.4.4" %}
{% set commit = "51c975354b8c4db0c579cd30b284d5bdc7b3f7f7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pygpc-polynomial-chaos/pygpc/archive/{{ commit }}.tar.gz
  sha256: 2d03311925999a1d47e6f96eca1607e2af3f7f8d2b9191fc35ec99641e3e7e1c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  host:
    - python
    - pip
    - setuptools
    - wheel
    - numpy >=1.24.1,<2.0dev0
  run:
    - python
    - scipy >=1.10.0
    - numpy >=1.24.1,<2.0dev0
    - scikit-learn >=1.2.0
    - h5py >=3.7.0
    - tqdm >=4.64.1
    - pandas >=1.5.2
    - matplotlib-base >=3.6.3

about:
  home: https://github.com/pygpc-polynomial-chaos/pygpc
  license: GPL-3.0
  license_file: LICENSE
  summary: A sensitivity and uncertainty analysis toolbox for Python

extra:
  recipe-maintainers:
    - simnibs-bot
